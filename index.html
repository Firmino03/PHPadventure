<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>PHPadventure — aprenda Laravel jogando</title>
<meta name="description" content="Estude Laravel, MVC, Eloquent e Blade num quiz com clima de fazenda pixelada." />
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🐘</text></svg>" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Space+Mono:ital,wght@0,400;0,700;1,400&family=Syne:wght@400;600;700;800&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="style.css" />
</head>
<body>

  <nav id="nav-principal" aria-label="Trilhas de estudo">
    <div class="nav-logo" data-nav="home">
      <span class="nav-logo-badge">PHP</span>
      <span class="nav-logo-texto">adventure</span>
    </div>
    <div class="nav-links" id="topicNav"></div>
  </nav>

  <div id="app"></div>

  <footer class="site-footer">
    <div class="footer-inner">
      <div class="footer-brand">
        <div>
          <p class="footer-credit">Desenvolvido por <strong>@Karolayne_Firmino</strong></p>
          <p class="footer-tagline">Essa é uma plataforma interativa para fins educativos. Fique a vontade para sugerir melhorias!😉 </p>
          <p class="footer-meta">Feito com HTML, CSS e JavaScript puro · © 2026 PHPadventure</p>
        </div>
      </div>
      <div class="footer-actions">
        <a class="footer-btn" href="https://www.linkedin.com/in/karolayne-firmino" target="_blank" rel="noopener noreferrer">
          <span aria-hidden="true">🔗</span> LinkedIn
        </a>
        <a class="footer-btn" href="https://github.com/Firmino03" target="_blank" rel="noopener noreferrer">
          <span aria-hidden="true">💻</span> GitHub
        </a>
        <a class="footer-btn footer-btn-accent" href="mailto:karolaynefirmino27@gmail.com">
          <span aria-hidden="true">📧</span> Sugestões
        </a>
      </div>
    </div>
  </footer>

  <!-- Modal de resultado da resposta -->
  <div id="resultModal" class="modal-video">
    <div class="modal-inner modal-resultado">
      <div class="modal-cabecalho">
        <span class="modal-titulo">// resultado</span>
        <button id="closeModal" class="modal-fechar" aria-label="Fechar">✕</button>
      </div>
      <div class="modal-corpo">
        <div class="modal-reacao">
          <img id="reactionImg" src="" alt="" />
          <p id="reactionTitle" class="reacao-titulo"></p>
          <p id="reactionText" class="reacao-texto"></p>
        </div>

        <div class="caixa-info">
          <img src="assets/elephant-curious.png" alt="Elefante curioso" width="56" height="56" style="flex-shrink:0;width:56px;height:auto;align-self:flex-start" />
          <div>
            <p class="home-secao-label" style="margin-bottom:6px">// Curiosidade da questão</p>
            <p id="curiosityText"></p>
          </div>
        </div>

        <button id="nextBtn" class="btn-primario">Continuar a jornada →</button>
      </div>
    </div>
  </div>

  <!-- Modal de vídeo -->
  <div class="modal-video" id="modal-video">
    <div class="modal-inner">
      <div class="modal-cabecalho">
        <span class="modal-titulo" id="modal-titulo-texto"></span>
        <button class="modal-fechar" id="modal-fechar" aria-label="Fechar">✕</button>
      </div>
      <div class="modal-iframe-wrap">
        <iframe id="modal-iframe" src="" title="Videoaula" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe>
      </div>
    </div>
  </div>

  <script src="data.js"></script>
  <script src="app.js"></script>
</body>
</html>
